name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Pobierz wskazaną wersję repozytorium
        uses: actions/checkout@v7

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sprawdź katalog offline przed publikacją
        run: |
          npm test
          npm run qa:catalog

      - name: Przygotuj pliki strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v5
