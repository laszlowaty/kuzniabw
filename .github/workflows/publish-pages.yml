name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Pobierz wskazaną wersję repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj pliki strony
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          include-hidden-files: true

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
